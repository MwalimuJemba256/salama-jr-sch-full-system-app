name: salaama_school_app
description: Salaama Muslim Junior School - Complete System with Tahfiz
publish_to: 'none'
version: 2.0.0+20
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  pdf: ^3.10.8
  printing: ^5.11.1
  fl_chart: ^0.68.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  image_picker: ^1.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1#
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
        - assets/images/logo.png
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0D47A1"
    theme_color: "#0D47A1"